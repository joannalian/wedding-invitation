<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>正在開啟 Google 行事曆</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: #f7f0e6;
      color: #4a302b;
      font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif;
      text-align: center;
    }
    main { max-width: 360px; }
    .ring { font-size: 2rem; }
    h1 { margin: 14px 0 8px; font-family: Georgia, serif; font-size: 1.35rem; }
    p { margin: 0 0 20px; color: #745a52; line-height: 1.7; }
    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      background: #8b3f44;
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="ring" aria-hidden="true">💍</div>
    <h1>正在開啟 Google 行事曆</h1>
    <p>活動資料會在瀏覽器中預先填好。</p>
    <a id="continueLink" href="#">若未自動開啟，請點這裡</a>
  </main>
  <script>
    const googleCalendarUrl = 'https://calendar.google.com/calendar/r/eventedit?' + new URLSearchParams({
      action: 'TEMPLATE',
      text: '💍 咏朋&怡蘭 婚宴',
      dates: '20261114T040000Z/20261114T070000Z',
      stz: 'Asia/Taipei',
      etz: 'Asia/Taipei',
      details: '誠摯邀請您，與我們共享這一天。婚宴時間：中午 12:00。',
      location: 'The Lin 林酒店 3F 世紀廳，臺中市西屯區朝富路99號'
    }).toString();
    document.getElementById('continueLink').href = googleCalendarUrl;
    window.setTimeout(() => window.location.replace(googleCalendarUrl), 120);
  </script>
</body>
</html>
